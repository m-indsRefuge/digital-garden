[project]
name = "digital-garden"
version = "0.1.0"
description = "A living desktop garden artifact and deterministic learning environment."
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.10,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
]

[project.scripts]
digital-garden = "digital_garden.cli:main"
digital-garden-ui-spike = "digital_garden.ui_spike.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_garden"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
exclude = ["docs/superpowers/plans/2026-08-13-digital-garden-v0a-garden-world.md"]
